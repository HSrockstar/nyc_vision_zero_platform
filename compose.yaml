name: vision-zero-dev
services:
  db:
    image: "${VISION_ZERO_DB_IMAGE:?请先运行 scripts/bootstrap.ps1}"
    pull_policy: never
    platform: linux/amd64
    container_name: vision-zero-dev-db
    labels:
      vision-zero.scope: development
      vision-zero.workspace: "${VISION_ZERO_WORKSPACE_ID:?缺少工作区标识}"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: "${VISION_ZERO_DATABASE_NAME:?缺少数据库名称}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?缺少本地随机凭据}"
    ports:
      - "127.0.0.1:${VISION_ZERO_DB_PORT:-55433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"
    mem_limit: 1g
    cpus: 2
volumes:
  pgdata:
    name: vision-zero-dev-postgis-data
    labels:
      vision-zero.scope: development
      vision-zero.workspace: "${VISION_ZERO_WORKSPACE_ID:?缺少工作区标识}"
